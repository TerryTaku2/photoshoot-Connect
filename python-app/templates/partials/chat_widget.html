<div class="chat-widget" data-chat-widget
  data-brand-name="{{ studio.brand_name }}"
  data-email="{{ studio.email }}"
  data-phone="{{ studio.phone }}"
  data-location="{{ studio.location }}">
  <div class="chat-panel">
    <div class="chat-panel-header">
      <p>{{ studio.brand_name }} assistant</p>
      <button type="button" class="chat-panel-close" aria-label="Close chat">✕</button>
    </div>
    <div class="chat-messages">
      <div class="chat-message bot">Hi! I'm the {{ studio.brand_name }} assistant. Ask me about pricing, booking, or location.</div>
    </div>
    <div class="chat-input-row">
      <input type="text" class="input" placeholder="Ask a question…">
      <button type="button" class="btn btn-primary btn-sm">Send</button>
    </div>
  </div>
  <button type="button" class="chat-toggle" aria-label="Open chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="24" height="24">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
    </svg>
  </button>
</div>
