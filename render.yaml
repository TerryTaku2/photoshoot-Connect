services:
  - type: web
    name: photoshoot-studio
    runtime: node
    plan: starter
    buildCommand: mkdir -p /var/data/uploads && npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/dev.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: SESSION_SECRET
        sync: false
